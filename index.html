<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Carchope Design 05 exact visual preview">
<title>Carchope — Design 05</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff}
body{font-family:Arial,Helvetica,sans-serif}
.stage{position:relative;width:min(100%,1000px);margin:0 auto;background:#fff;line-height:0}
#design{display:block;width:100%;height:auto;opacity:0;transition:opacity .15s ease}
#design.ready{opacity:1}
.loader{height:100vh;display:flex;align-items:center;justify-content:center;font:11px/1 Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#999}
.hot{position:absolute;z-index:4;display:block;background:transparent}
.buy{left:34.7%;top:1.1%;width:8%;height:3.5%}
.sell{left:43.8%;top:1.1%;width:8%;height:3.5%}
.consign{left:52.2%;top:1.1%;width:12%;height:3.5%}
.services{left:64.2%;top:1.1%;width:12%;height:3.5%}
.about{left:76.1%;top:1.1%;width:9%;height:3.5%}
.menu{left:89%;top:1%;width:7%;height:4%}
.arrow{left:6.5%;top:26%;width:11%;height:4.8%;border-radius:50%}
.p1{left:5%;top:34.4%;width:28%;height:7.4%}
.p2{left:35%;top:34.4%;width:28%;height:7.4%}
.p3{left:66%;top:34.4%;width:29%;height:7.4%}
.viewall{left:80%;top:53.1%;width:16%;height:3.6%}
.car1{left:5%;top:56.2%;width:28.7%;height:14.8%}
.car2{left:35.4%;top:56.2%;width:28.7%;height:14.8%}
.car3{left:66%;top:56.2%;width:29%;height:14.8%}
@media(max-width:640px){.stage{width:100%}}
</style>
</head>
<body>
<div class="stage">
  <div class="loader" id="loader">Loading Design 05</div>
  <img id="design" alt="Carchope Design 05 exact visual preview">
  <a class="hot buy" aria-label="Buy" href="https://www.carchope.com/products" target="_blank" rel="noopener"></a>
  <a class="hot sell" aria-label="Sell" href="https://www.carchope.com/sell-your-cars" target="_blank" rel="noopener"></a>
  <a class="hot consign" aria-label="Consign" href="https://www.carchope.com/consignment" target="_blank" rel="noopener"></a>
  <a class="hot services" aria-label="Services" href="https://www.carchope.com/service" target="_blank" rel="noopener"></a>
  <a class="hot about" aria-label="About" href="https://www.carchope.com/about-us" target="_blank" rel="noopener"></a>
  <a class="hot menu" aria-label="Home" href="https://www.carchope.com/" target="_blank" rel="noopener"></a>
  <a class="hot arrow" aria-label="Browse cars" href="https://www.carchope.com/products" target="_blank" rel="noopener"></a>
  <a class="hot p1" aria-label="Buy a car" href="https://www.carchope.com/products" target="_blank" rel="noopener"></a>
  <a class="hot p2" aria-label="Sell your car" href="https://www.carchope.com/sell-your-cars" target="_blank" rel="noopener"></a>
  <a class="hot p3" aria-label="Consign your car" href="https://www.carchope.com/consignment" target="_blank" rel="noopener"></a>
  <a class="hot viewall" aria-label="View all cars" href="https://www.carchope.com/products" target="_blank" rel="noopener"></a>
  <a class="hot car1" aria-label="Featured car one" href="https://www.carchope.com/products" target="_blank" rel="noopener"></a>
  <a class="hot car2" aria-label="Featured car two" href="https://www.carchope.com/products" target="_blank" rel="noopener"></a>
  <a class="hot car3" aria-label="Featured car three" href="https://www.carchope.com/products" target="_blank" rel="noopener"></a>
</div>
<script>
(async()=>{
  const files=[
    'assets/d5-000.txt','assets/d5-001.txt',
    'assets/d5-01x.txt','assets/d5-02x.txt','assets/d5-03x.txt',
    'assets/d5-04x.txt','assets/d5-05x.txt','assets/d5-06x.txt',
    'assets/d5-01.txt','assets/d5-02.txt','assets/d5-03.txt',
    'assets/d5-04.txt','assets/d5-05.txt'
  ];
  try{
    const parts=await Promise.all(files.map(async f=>{
      const r=await fetch(f,{cache:'no-store'});
      if(!r.ok) throw new Error(f);
      return (await r.text()).trim();
    }));
    const img=document.getElementById('design');
    img.onload=()=>{
      document.getElementById('loader').style.display='none';
      img.classList.add('ready');
    };
    img.src='data:image/jpeg;base64,'+parts.join('');
  }catch(e){
    document.getElementById('loader').textContent='Preview failed to load — refresh once';
  }
})();
</script>
</body>
</html>
